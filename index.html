<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- viewport-fit=cover enables env(safe-area-inset-*) on notched
         devices so the bottom nav doesn't get clipped by the home
         indicator. user-scalable=yes keeps accessibility zoom available;
         interactive-widget=resizes-content makes the iOS keyboard push
         content up instead of overlaying it (fixes "I can't see the
         submit button" on form pages). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Browser chrome theme color. Matches the brand green so the
         iOS Safari address bar + Android Chrome status bar pick up
         the brand tint instead of plain white. -->
    <meta name="theme-color" content="#2d6a4f" />
    <!-- Apple touch icon — what shows up when a contractor "Add to
         Home Screen"s the app on iOS. Real 180x180 green PNG icon
         (generated by scripts/gen-pwa-icons.cjs). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tradevoice" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- PWA: installable web-app manifest + standard capability flag. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Tradevoice runs your trade business end to end — estimates, quotes, invoices, and card payments — built for plumbers, electricians, HVAC, roofers, and specialty contractors." />
    <title>tradevoice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
